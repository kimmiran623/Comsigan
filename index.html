<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전 학급 현재 시간표</title><style>
:root{font-family:'Malgun Gothic',Pretendard,system-ui,sans-serif;color:#152033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{padding:16px;max-width:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:clamp(24px,2.5vw,36px);margin:2px 0}.muted{color:#526174;font-size:14px}.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{font:700 15px inherit;font-size:15px;border:1px solid #b9c6d7;background:white;padding:10px 14px;border-radius:9px;cursor:pointer}.btn:disabled{opacity:.5}.panel{background:#fff;border:1px solid #d6dfeb;border-radius:12px;padding:12px}.status{min-height:24px;font-size:14px;color:#526174;margin:9px 0}.error{color:#b42318}.scroll{overflow:auto;max-height:calc(100vh - 205px);border:1px solid #bac5d4;border-radius:6px}.schedule{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}.schedule th,.schedule td{border-right:1px solid #aeb9c8;border-bottom:1px solid #aeb9c8;text-align:center;vertical-align:middle}.schedule thead th{position:sticky;background:#e9eef6;z-index:3}.schedule thead tr:first-child th{top:0;height:43px;font-size:clamp(20px,2vw,29px);font-weight:800}.schedule thead tr:nth-child(2) th{top:43px;height:42px;font-size:clamp(17px,1.6vw,24px)}.schedule .period{position:sticky;left:0;z-index:4;background:#e9eef6;min-width:82px;width:82px;font-weight:800;font-size:18px}.schedule thead .period{z-index:6}.schedule td.lesson{width:clamp(95px,5.6vw,140px);min-width:95px;height:clamp(80px,11vh,126px);padding:5px 3px;background:var(--subject-bg,#fff);color:var(--subject-fg,#142033)}.schedule td .subject{font-weight:850;font-size:clamp(18px,1.45vw,25px);line-height:1.16;overflow-wrap:anywhere;word-break:keep-all}.schedule td .teacher{font-size:clamp(12px,.95vw,16px);font-weight:600;margin-top:5px;line-height:1.15}.schedule td.empty{background:#fafbfd;color:#a0aab8;font-size:20px}.schedule .grade-start{border-left:3px solid #526b8a}.schedule td.modified{box-shadow:inset 0 0 0 4px #ed8a00;position:relative}.schedule td.modified:after{content:'변경';position:absolute;right:2px;top:2px;font-size:10px;font-weight:900;color:#784000;background:#ffe5a2;border-radius:3px;padding:2px 3px}.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:#526174;margin-top:10px}.mark{display:inline-block;width:16px;height:16px;border:3px solid #ed8a00;border-radius:3px;vertical-align:middle}.note{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:700px){main{padding:8px}.panel{padding:8px}.schedule td.lesson{min-width:92px}.scroll{max-height:75vh}}
</style></head><body><main><header><div><div class="muted" id="school">학교 정보 조회 중</div><h1>전 학급 현재 시간표</h1><div class="meta"><span id="today" class="muted">한국 날짜 확인 중…</span><span id="counts" class="muted"></span></div><div id="updated" class="muted">시간표를 불러오는 중…</div></div><button class="btn" id="refresh" type="button">↻ 지금 새로고침</button></header><section class="panel"><div id="status" class="status" role="status" aria-live="polite">조회 중…</div><div class="scroll"><table class="schedule" aria-label="현재 날짜의 전체 학급 시간표"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="legend"><span><span class="mark"></span> 변경 표시가 제공된 수업</span><span>과목별 배경색 적용</span><span>1시간마다 자동 재조회</span></div><div class="note">대한민국 시간(KST) 기준 오늘 요일의 시간표를 표시합니다. 토·일요일에는 다음 월요일 시간표를 표시합니다. 변경 표시는 컴시간 파서가 변경 정보를 제공한 경우에만 나타납니다. 가로로 스크롤하여 모든 반을 확인할 수 있습니다.</div></section></main><script>
const $=id=>document.getElementById(id);const DAYS=['월','화','수','목','금','토','일'];const WEEK={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};const pad=n=>String(n).padStart(2,'0');
function kst(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value;const year=+get('year'),month=+get('month'),date=+get('day'),index=WEEK[get('weekday')];return {key:`${year}-${pad(month)}-${pad(date)}`,label:`${year}. ${pad(month)}. ${pad(date)}. (${DAYS[index]})`,day:index>=5?0:index,weekend:index>=5};}
let current=kst(),data=null,loading=false;
const palette=[['#e5efff','#163b70'],['#fce8e6','#783b3b'],['#e7f4e9','#235c3b'],['#fff1d9','#80521d'],['#f0e9ff','#593b84'],['#dff3f5','#235d65'],['#fce8f1','#813e64'],['#e9edf2','#394a5c'],['#f3f2db','#62601d'],['#e7f1df','#46632d'],['#f2e7dc','#785032'],['#e3e9f9','#3a4f88']];
function subjectColors(name){const key=(name||'').replace(/\s+/g,'').normalize('NFC');let hash=2166136261;for(const c of key){hash^=c.codePointAt(0);hash=Math.imul(hash,16777619)}return palette[(hash>>>0)%palette.length]}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function render(){const day=current.day;$('today').textContent=`대한민국 ${current.label}${current.weekend?' · 다음 월요일 시간표 표시':''}`;if(!data)return;const groups=[1,2,3].map(grade=>({grade,classes:Object.keys(data.grades?.[grade]||{}).map(Number).filter(Number.isInteger).sort((a,b)=>a-b)}));$('counts').textContent=groups.map(g=>`${g.grade}학년 ${g.classes.length}개 반`).join(' · ');const head=$('head');head.replaceChildren();const top=el('tr');top.append(el('th','교시','period'));for(const group of groups){if(!group.classes.length)continue;const th=el('th',`${group.grade}학년`);th.colSpan=group.classes.length;top.append(th)}head.append(top);const row=el('tr');row.append(el('th','','period'));for(const group of groups)group.classes.forEach((c,i)=>row.append(el('th',`${c}반`,i===0?'grade-start':'')));head.append(row);
const entries=groups.flatMap(g=>g.classes.map((c,i)=>({grade:g.grade,number:c,first:i===0,periods:data.grades[g.grade][c]?.[day]||[]})));const max=Math.max(7,...entries.flatMap(e=>e.periods.map(p=>Number(p.period)||0)));const body=$('body');body.replaceChildren();for(let period=1;period<=max;period++){const tr=el('tr');tr.append(el('td',`${period}교시`,'period'));for(const entry of entries){const lesson=entry.periods.find(p=>Number(p.period)===period);const td=el('td',undefined,`lesson ${entry.first?'grade-start ':''}${lesson?.modified?'modified':''}${!lesson?' empty':''}`);if(lesson){const [bg,fg]=subjectColors(lesson.subject);td.style.setProperty('--subject-bg',bg);td.style.setProperty('--subject-fg',fg);td.append(el('div',lesson.subject||'—','subject'));if(lesson.teacher)td.append(el('div',lesson.teacher,'teacher'));if(lesson.modified)td.title='컴시간 파서에서 변경 표시가 제공된 수업'}else td.textContent='—';tr.append(td)}body.append(tr)}if(!entries.length){const tr=el('tr');const td=el('td','학급 정보가 없습니다.');td.colSpan=1;tr.append(td);body.append(tr)}}
async function load(force=false){if(loading)return;loading=true;$('refresh').disabled=true;$('status').textContent='최신 시간표 조회 중…';$('status').classList.remove('error');try{const response=await fetch('/api/timetable'+(force?'?refresh=1':''),{cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.error||'시간표 조회 실패');data=result;$('school').textContent=result.school;$('updated').textContent='마지막 서버 조회: '+new Date(result.fetchedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});render();$('status').textContent='시간표 조회 완료'}catch(e){$('status').textContent='조회 실패: '+e.message+(data?' · 이전 데이터를 유지합니다.':'');$('status').classList.add('error')}finally{loading=false;$('refresh').disabled=false}}
function syncDate(){const next=kst();if(next.key!==current.key){current=next;render();load(true)}}$('refresh').addEventListener('click',()=>load(true));render();load();setInterval(()=>load(true),3600000);setInterval(syncDate,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDate()});
</script></body></html>
