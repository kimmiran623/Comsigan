<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2학년 1반 시간표</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#20283b;background:#f4f6fa}*{box-sizing:border-box}main{max-width:960px;margin:48px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:8px 0;font-size:clamp(25px,4vw,34px)}.muted{color:#64748b;font-size:14px}.panel{background:white;border:1px solid #e3e8f0;border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 5px 20px #19233b08}.actions{display:flex;gap:8px;align-items:center}button{border:1px solid #d5dce8;background:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}button.primary{background:#304ec9;color:white;border-color:#304ec9}button:disabled{opacity:.5;cursor:wait}.scroll{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:5px;min-width:600px;table-layout:fixed}th{padding:12px 4px;color:#4b5c78;font-size:14px}td{height:83px;text-align:center;border-radius:10px;background:#f3f6fc;padding:10px 5px}td:first-child{width:60px;background:white;font-weight:700;color:#64748b}td strong{display:block;font-size:16px}td small{display:block;color:#778398;margin-top:5px}td.changed{background:#fff3d9}#status{min-height:24px}.footer{margin-top:15px}
</style></head><body><main><header><div><div class="muted">서귀포대신중학교 · 고정 학급</div><h1>2학년 1반 시간표</h1><div class="muted" id="updated">아직 불러오지 않았습니다.</div></div><div class="actions"><button class="primary" id="refresh">↻ 새로고침</button></div></header><section class="panel"><div id="status" role="status" class="muted">시간표를 불러오는 중입니다…</div><div class="scroll"><table aria-label="주간 시간표"><thead><tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead><tbody id="body"></tbody></table></div><div class="footer muted">노란색은 원본 데이터에 변경 표시가 있는 수업입니다. 조회 결과는 컴시간 제공 데이터 기준이며, 실제 주차 선택은 지원하지 않습니다.</div></section></main><script>
const tbody=document.getElementById('body'), status=document.getElementById('status'), updated=document.getElementById('updated'),btn=document.getElementById('refresh');
async function load(){btn.disabled=true;status.textContent='최신 시간표 조회 중…';try{const r=await fetch('/api/timetable?now='+Date.now(),{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'조회 실패');const days=data.days||[];const count=Math.max(7,...days.map(d=>d.length));tbody.replaceChildren();for(let p=1;p<=count;p++){const tr=document.createElement('tr');const label=document.createElement('td');label.textContent=p+'교시';tr.append(label);for(let d=0;d<5;d++){const td=document.createElement('td');const entry=(days[d]||[]).find(x=>Number(x.period)===p);if(entry){const name=document.createElement('strong');name.textContent=entry.subject||'—';td.append(name);if(entry.teacher){const small=document.createElement('small');small.textContent=entry.teacher;td.append(small)}if(entry.modified)td.classList.add('changed')}else td.textContent='—';tr.append(td)}tbody.append(tr)}updated.textContent='마지막 조회: '+new Date(data.fetchedAt).toLocaleString('ko-KR');status.textContent='시간표를 불러왔습니다.'}catch(e){status.textContent='시간표를 가져오지 못했습니다: '+e.message;tbody.replaceChildren()}finally{btn.disabled=false}}
btn.addEventListener('click',load);load();
</script></body></html>
