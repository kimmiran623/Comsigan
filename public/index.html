<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전 학급 시간표</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#192437;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{padding:24px;max-width:1900px;margin:auto}header{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(23px,2.5vw,32px);margin:5px 0 9px}.sub{font-size:13px;color:#64748b}.panel{margin-top:18px;border:1px solid #e1e6ef;border-radius:16px;background:white;box-shadow:0 6px 24px #18243a0a;padding:18px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.days{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;border:1px solid #cfd8e5;background:#fff;color:#28384c;border-radius:9px;padding:9px 15px;cursor:pointer}button.active{background:#234a9b;border-color:#234a9b;color:white}button:disabled{opacity:.5;cursor:wait}.status{font-size:13px;color:#64748b}.status.error{color:#b42318}.scroll{overflow:auto;max-height:75vh;border:1px solid #cbd5e1;border-radius:8px}.schedule{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:max-content;width:100%}.schedule th,.schedule td{border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;text-align:center;vertical-align:middle}.schedule th{background:#f0f4fb}.schedule thead th{position:sticky;z-index:2}.schedule thead tr:first-child th{top:0;height:43px;font-size:19px}.schedule thead tr:nth-child(2) th{top:43px;height:39px;font-size:14px}.schedule .period{position:sticky;left:0;z-index:3;background:#f1f5f9;min-width:80px;width:80px;font-weight:700}.schedule thead .period{z-index:5}.schedule td{min-width:72px;width:72px;height:64px;padding:5px 3px;font-size:12px;line-height:1.35;background:white;white-space:normal;overflow-wrap:anywhere}.schedule td strong{display:block;font-size:13px}.schedule td small{display:block;color:#64748b;margin-top:3px}.schedule td.modified{background:#fff3d9}.schedule .grade-start{border-left:3px solid #64748b}.schedule tbody tr:nth-child(even) td:not(.period):not(.modified){background:#f8fafc}.note{margin-top:12px;color:#64748b;font-size:12px}.counts{font-size:13px;color:#334155;font-weight:600}.placeholder{padding:24px;text-align:center;color:#64748b}@media(max-width:650px){main{padding:12px}.panel{padding:12px}.schedule td{min-width:65px;width:65px}.schedule .period{min-width:63px;width:63px}}
</style></head><body><main>
<header><div><div class="sub" id="school">학교 정보를 불러오는 중</div><h1>전 학급 시간표</h1><div class="sub" id="today">대한민국 날짜 확인 중…</div><div class="sub" id="updated">컴시간 시간표를 조회하고 있습니다.</div></div><button id="refresh">↻ 지금 새로고침</button></header>
<section class="panel"><div class="toolbar"><div class="days" id="days"><button data-day="0">월요일</button><button data-day="1">화요일</button><button data-day="2">수요일</button><button data-day="3">목요일</button><button data-day="4">금요일</button></div><div class="counts" id="counts">학급 수 확인 중…</div><div class="sub" id="selectedDate"></div></div><p class="status" id="status" role="status" aria-live="polite">시간표를 불러오는 중입니다…</p><div class="scroll"><table class="schedule" aria-label="선택한 요일의 전체 학급 시간표"><thead id="head"></thead><tbody id="body"><tr><td class="placeholder">조회 중…</td></tr></tbody></table></div><div class="note">표는 가로로 스크롤할 수 있습니다. 노란색은 컴시간 데이터에 변경 표시가 있는 수업입니다. 대한민국 표준시(KST)의 오늘 날짜에 맞춰 요일이 자동 선택되며, 주말에는 다음 월요일을 표시합니다. 날짜가 바뀌면 자동 전환하고, 사이트가 열려 있는 동안 1시간마다 시간표를 다시 조회합니다. 표시된 학급 수는 실제 조회된 데이터 기준입니다.</div></section>
</main><script>
const $=id=>document.getElementById(id);
// 날짜 계산은 사용자의 컴퓨터 시간대가 아닌 대한민국 표준시(KST) 기준입니다.
function koreaToday(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date());
  const value=type=>parts.find(p=>p.type===type)?.value;
  return {year:Number(value('year')),month:Number(value('month')),date:Number(value('day')),weekday:value('weekday')};
}
const dayIndex={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
const weekdays=['월','화','수','목','금','토','일'];
const pad=n=>String(n).padStart(2,'0');
function koreaDateInfo(){
  const today=koreaToday(),index=dayIndex[today.weekday];
  // 토·일요일에는 다음 월요일 시간표를 기본으로 표시합니다.
  const defaultDay=index>=5?0:index;
  const todayUTC=Date.UTC(today.year,today.month-1,today.date);
  const mondayUTC=todayUTC-(index*86400000)+(index>=5?7*86400000:0);
  return {today,index,defaultDay,mondayUTC,key:`${today.year}-${pad(today.month)}-${pad(today.date)}`};
}
function formatKoreanDate(ms){
  const date=new Date(ms);
  return `${date.getUTCFullYear()}.${pad(date.getUTCMonth()+1)}.${pad(date.getUTCDate())}. (${weekdays[date.getUTCDay()===0?6:date.getUTCDay()-1]})`;
}
let dateInfo=koreaDateInfo(),selectedDay=dateInfo.defaultDay,data=null,loading=false;
function updateDates(){
  const t=dateInfo.today;
  $('today').textContent=`대한민국 오늘: ${t.year}.${pad(t.month)}.${pad(t.date)}. (${weekdays[dateInfo.index]}) · KST`;
  $('selectedDate').textContent=`표시 날짜: ${formatKoreanDate(dateInfo.mondayUTC+selectedDay*86400000)}`;
}
function syncKoreaDate(){
  const latest=koreaDateInfo();
  if(latest.key!==dateInfo.key){
    dateInfo=latest;
    selectedDay=latest.defaultDay;
    updateDates();
    render();
    load(true);
  }
}
function cell(tag,content,cls){const el=document.createElement(tag);if(content!==undefined)el.textContent=content;if(cls)el.className=cls;return el;}
function render(){updateDates();if(!data)return;const groups=[1,2,3].map(g=>({grade:g,classes:Object.keys(data.grades?.[g]||{}).map(Number).filter(Number.isFinite).sort((a,b)=>a-b)}));const total=groups.reduce((n,g)=>n+g.classes.length,0);$('counts').textContent=groups.map(g=>`${g.grade}학년 ${g.classes.length}개 반`).join(' · ')+` · 총 ${total}개 반`;
const thead=$('head');thead.replaceChildren();const top=document.createElement('tr');top.append(cell('th','교시','period'));for(const g of groups){if(!g.classes.length)continue;const th=cell('th',`${g.grade}학년`);th.colSpan=g.classes.length;top.append(th)}thead.append(top);
const second=document.createElement('tr');const p=cell('th','', 'period');second.append(p);for(const g of groups){g.classes.forEach((c,i)=>second.append(cell('th',`${c}반`,i===0?'grade-start':'')))}thead.append(second);
const entries=[];for(const g of groups)for(const c of g.classes)entries.push({grade:g.grade,classNo:c,periods:data.grades[g.grade][c]?.[selectedDay]||[],first:c===g.classes[0]});const max=Math.max(7,...entries.flatMap(e=>e.periods.map(p=>Number(p.period)||0)));const tbody=$('body');tbody.replaceChildren();for(let period=1;period<=max;period++){const tr=document.createElement('tr');tr.append(cell('td',`${period}교시`,'period'));for(const entry of entries){const lesson=entry.periods.find(p=>Number(p.period)===period);const td=cell('td','',`${entry.first?'grade-start ':''}${lesson?.modified?'modified':''}`);if(lesson){td.append(cell('strong',lesson.subject||'—'));if(lesson.teacher)td.append(cell('small',lesson.teacher))}else td.textContent='—';tr.append(td)}tbody.append(tr)}if(!entries.length){const tr=document.createElement('tr');const td=cell('td','해당 학교의 학급 정보가 없습니다.','placeholder');tr.append(td);tbody.append(tr)}for(const b of $('days').querySelectorAll('button')){const active=Number(b.dataset.day)===selectedDay;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}}
async function load(force=false){if(loading)return;loading=true;$('refresh').disabled=true;$('status').textContent='최신 시간표를 조회하고 있습니다…';$('status').classList.remove('error');try{const response=await fetch('/api/timetable'+(force?'?refresh=1':''),{cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.error||'조회 실패');data=result;$('school').textContent=result.school;$('updated').textContent='마지막 데이터 조회: '+new Date(result.fetchedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · 자동 갱신 60분';render();$('status').textContent='시간표 조회 완료'}catch(err){$('status').textContent='조회 실패: '+err.message+(data?' · 이전 조회 결과를 유지합니다.':'');$('status').classList.add('error')}finally{loading=false;$('refresh').disabled=false}}
$('days').addEventListener('click',e=>{const btn=e.target.closest('button[data-day]');if(!btn)return;selectedDay=Number(btn.dataset.day);render()});$('refresh').addEventListener('click',()=>load(true));updateDates();load();setInterval(()=>load(true),60*60*1000);setInterval(syncKoreaDate,60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncKoreaDate()});
</script></body></html>
